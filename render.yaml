services:
  - type: web
    name: tatadana-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_BASE_URL
        value: https://tatadana-app.onrender.com
